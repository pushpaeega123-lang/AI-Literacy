<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Powered Learning Support Assistant</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts: Poppins + Noto Sans Telugu + Noto Sans Devanagari -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+Telugu&family=Noto+Sans+Devanagari:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet"
        href="/static/css/style.css">

    

    

</head>

<body>

    <!-- Navigation Bar -->

    <nav class="navbar navbar-expand-lg navbar-dark shadow-lg">

        <div class="container">

            <a class="navbar-brand fw-bold" href="/">

                🤖 AI Learning Assistant

            </a>

            <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse"
                id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a class="nav-link" href="/">

                            Home

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link"
                            href="/register">

                            Register

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link"
                            href="/login">

                            Login

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- Flash Messages -->

    <div class="container mt-3">

        

        

        

    </div>


    <!-- Main Content -->

    

<section class="hero-section">

    <div class="container">

        <div class="row align-items-center">

            <!-- Left Side -->

            <div class="col-lg-6">

                <h1 class="display-4 fw-bold text-primary mb-3">

                    AI Powered Learning Support Assistant

                </h1>

                <p class="lead">

                    Welcome! Select your preferred language and begin your personalized learning journey with AI.

                </p>

                <form action="/language" method="POST">

                    <div class="language-card mt-4">

                        <h3 class="mb-4 text-center">

                            🌍 Choose Your Language

                        </h3>

                        <div class="form-check language-option">

                            <input
                                class="form-check-input"
                                type="radio"
                                name="language"
                                value="English"
                                id="english"
                                checked>

                            <label class="form-check-label" for="english">

                                🇬🇧 English

                            </label>

                        </div>

                        <div class="form-check language-option">

                            <input
                                class="form-check-input"
                                type="radio"
                                name="language"
                                value="Telugu"
                                id="telugu">

                            <label class="form-check-label" for="telugu">

                                🇮🇳 తెలుగు

                            </label>

                        </div>

                        <div class="form-check language-option">

                            <input
                                class="form-check-input"
                                type="radio"
                                name="language"
                                value="Hindi"
                                id="hindi">

                            <label class="form-check-label" for="hindi">

                                🇮🇳 हिन्दी

                            </label>

                        </div>

                        <button class="btn btn-primary btn-lg w-100 mt-4">

                            Continue →

                        </button>

                    </div>

                </form>

            </div>

            <!-- Right Side -->

            <div class="col-lg-6 text-center">

                <img

                    src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png"

                    class="img-fluid hero-image"

                    alt="AI Learning">

            </div>

        </div>

    </div>

</section>







    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Main JS -->

    <script src="/static/js/main.js"></script>

    

    

</body>

</html>
