<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Powered Learning Support Assistant</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts: Poppins + Noto Sans Telugu + Noto Sans Devanagari -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+Telugu&family=Noto+Sans+Devanagari:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet"
        href="/static/css/style.css">

    

    

</head>

<body>

    <!-- Navigation Bar -->

    <nav class="navbar navbar-expand-lg navbar-dark shadow-lg">

        <div class="container">

            <a class="navbar-brand fw-bold" href="/">

                🤖 AI Learning Assistant

            </a>

            <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse"
                id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a class="nav-link" href="/">

                            Home

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link"
                            href="/register">

                            Register

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link"
                            href="/login">

                            Login

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- Flash Messages -->

    <div class="container mt-3">

        

        

        

    </div>


    <!-- Main Content -->

    

<section class="login-section">

    <div class="container py-5">

        <div class="row justify-content-center align-items-center">

            <!-- Left Side -->

            <div class="col-lg-5 mb-4">

                <div class="login-left text-center">

                    <img src="https://cdn-icons-png.flaticon.com/512/4712/4712035.png"
                        class="img-fluid login-image"
                        alt="Login">

                    <h2 class="mt-4 text-white fw-bold">

                        Welcome Back!

                    </h2>

                    <p class="text-white">

                        Login to continue your AI-powered learning journey.

                    </p>

                </div>

            </div>

            <!-- Right Side -->

            <div class="col-lg-5">

                <div class="card login-card shadow-lg border-0">

                    <div class="card-body p-5">

                        <h2 class="text-center fw-bold mb-4">

                            Login

                        </h2>

                        <form action="/login_user" method="POST">

                            <!-- Email -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Email Address

                                </label>

                                <input
                                    type="email"
                                    name="email"
                                    class="form-control"
                                    placeholder="Enter Email"
                                    required>

                            </div>

                            <!-- Password -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Password

                                </label>

                                <input
                                    type="password"
                                    id="loginPassword"
                                    name="password"
                                    class="form-control"
                                    placeholder="Enter Password"
                                    required>

                            </div>

                            <!-- Show Password -->

                            <div class="form-check mb-3">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    onclick="showPassword()">

                                <label class="form-check-label">

                                    Show Password

                                </label>

                            </div>

                            <!-- Forgot Password -->

                            <div class="text-end mb-3">

                                <a href="/forgot_password">

                                    Forgot Password?

                                </a>

                            </div>

                            <!-- Login Button -->

                            <button
                                class="btn btn-primary btn-lg w-100">

                                Login

                            </button>

                        </form>

                        <hr>

                        <div class="text-center">

                            Don&#39;t have an account?

                            <a href="/register">

                                Register Here

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

<script>

function showPassword(){

let pass=document.getElementById("loginPassword");

if(pass.type==="password"){

pass.type="text";

}

else{

pass.type="password";

}

}

</script>







    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Main JS -->

    <script src="/static/js/main.js"></script>

    

    

</body>

</html>
