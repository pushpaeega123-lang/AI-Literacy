<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Powered Learning Support Assistant</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts: Poppins + Noto Sans Telugu + Noto Sans Devanagari -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+Telugu&family=Noto+Sans+Devanagari:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet"
        href="/static/css/style.css">

    

    

</head>

<body>

    <!-- Navigation Bar -->

    <nav class="navbar navbar-expand-lg navbar-dark shadow-lg">

        <div class="container">

            <a class="navbar-brand fw-bold" href="/">

                🤖 AI Learning Assistant

            </a>

            <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse"
                id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a class="nav-link" href="/">

                            Home

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link"
                            href="/register">

                            Register

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link"
                            href="/login">

                            Login

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- Flash Messages -->

    <div class="container mt-3">

        

        

        

    </div>


    <!-- Main Content -->

    

<section class="register-section">

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-10">

                <div class="card register-card shadow-lg border-0">

                    <div class="row g-0">

                        <!-- Left Side -->

                        <div class="col-lg-5 illustration">

                            <div class="text-center p-4">

                                <img src="https://cdn-icons-png.flaticon.com/512/4712/4712027.png"
                                    class="img-fluid hero-register">

                                <h2 class="mt-4 fw-bold text-white">

                                    Welcome!

                                </h2>

                                <p class="text-white">

                                    Register to start your AI-powered learning journey.

                                </p>

                            </div>

                        </div>

                        <!-- Right Side -->

                        <div class="col-lg-7">

                            <div class="card-body p-5">

                                <h2 class="text-center mb-4 fw-bold">

                                    Create Account

                                </h2>

                                <form action="/register_user" method="POST">

                                    <div class="row">

                                        <div class="col-md-6 mb-3">

                                            <label class="form-label">

                                                Full Name

                                            </label>

                                            <input type="text"
                                                name="fullname"
                                                class="form-control"
                                                placeholder="Enter Full Name"
                                                required>

                                        </div>

                                        <div class="col-md-6 mb-3">

                                            <label class="form-label">

                                                Email

                                            </label>

                                            <input type="email"
                                                name="email"
                                                class="form-control"
                                                placeholder="Enter Email"
                                                required>

                                        </div>

                                    </div>

                                    <div class="row">

                                        <div class="col-md-6 mb-3">

                                            <label class="form-label">

                                                Password

                                            </label>

                                            <input type="password"
                                                id="password"
                                                name="password"
                                                class="form-control"
                                                placeholder="Password"
                                                required>

                                        </div>

                                        <div class="col-md-6 mb-3">

                                            <label class="form-label">

                                                Confirm Password

                                            </label>

                                            <input type="password"
                                                id="confirm"
                                                name="confirm"
                                                class="form-control"
                                                placeholder="Confirm Password"
                                                required>

                                        </div>

                                    </div>

                                    <div class="row">

                                        <div class="col-md-4 mb-3">

                                            <label class="form-label">

                                                Age

                                            </label>

                                            <input type="number"
                                                name="age"
                                                class="form-control"
                                                placeholder="Age"
                                                required>

                                        </div>

                                        <div class="col-md-4 mb-3">

                                            <label class="form-label">

                                                Education

                                            </label>

                                            <select
                                                class="form-select"
                                                name="education">

                                                <option>School</option>
                                                <option>Intermediate</option>
                                                <option>Diploma</option>
                                                <option>UG</option>
                                                <option>PG</option>

                                            </select>

                                        </div>

                                        <div class="col-md-4 mb-3">

                                            <label class="form-label">

                                                Learning Status

                                            </label>

                                            <select
                                                class="form-select"
                                                name="status">

                                                <option>Student</option>
                                                <option>Employee</option>
                                                <option>Beginner</option>
                                                <option>Job Seeker</option>

                                            </select>

                                        </div>

                                    </div>

                                    <div class="mb-3">

                                        <label class="form-label">

                                            Preferred Language

                                        </label>

                                        <select
                                            class="form-select"
                                            name="language">

                                            <option selected>English</option>
                                            <option>English</option>
                                            <option>Telugu</option>
                                            <option>Hindi</option>

                                        </select>

                                    </div>

                                    <div class="form-check mb-3">

                                        <input class="form-check-input"
                                            type="checkbox"
                                            onclick="togglePassword()">

                                        <label class="form-check-label">

                                            Show Password

                                        </label>

                                    </div>

                                    <button
                                        class="btn btn-primary btn-lg w-100">

                                        Register Now

                                    </button>

                                </form>

                                <hr>

                                <div class="text-center">

                                    Already have an account?

                                    <a href="/login">

                                        Login Here

                                    </a>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

<script>

function togglePassword(){

let pass=document.getElementById("password");

let confirm=document.getElementById("confirm");

if(pass.type==="password"){

pass.type="text";

confirm.type="text";

}

else{

pass.type="password";

confirm.type="password";

}

}

</script>







    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Main JS -->

    <script src="/static/js/main.js"></script>

    

    

</body>

</html>
