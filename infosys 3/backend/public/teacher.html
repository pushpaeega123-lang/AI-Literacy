<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teacher Review Queue</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">AI Literacy - Review Queue</a>
      <div class="d-flex">
        <a class="btn btn-sm btn-outline-secondary" href="/dashboard.html">Student Dashboard</a>
      </div>
    </div>
  </nav>
  <div class="container mt-4">
    <h3>Review Queue</h3>
    <div id="queue">Loading...</div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="reviewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Review Assessment</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="modal-body-content"></div>
          <div class="mb-3">
            <label class="form-label">Override overall score (0-100)</label>
            <input id="modal-override" class="form-control" type="number" min="0" max="100" />
          </div>
          <div class="mb-3">
            <label class="form-label">Reviewer feedback</label>
            <textarea id="modal-feedback" class="form-control" rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button id="modal-save" type="button" class="btn btn-primary">Save review</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/teacher.js"></script>
</body>
</html>
